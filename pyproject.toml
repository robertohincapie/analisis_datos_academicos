[project]
name = "academic-performance-analysis"
version = "0.1.0"
description = "Laboratorio de producción para análisis de desempeño académico"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "pyyaml",
    "scipy",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/academic_analysis"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88