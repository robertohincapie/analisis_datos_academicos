[project]
name = "academic-performance-analysis"
version = "0.1.0"
description = "Laboratorio de producción para análisis de desempeño académico"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "mlflow>=3.16.1",
    "pandas",
    "pyyaml",
    "scikit-learn>=1.9.1",
    "scipy",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "nbclient>=0.11.0",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/academic_analysis"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
